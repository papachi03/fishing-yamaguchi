# GitHub Pages への自動デプロイ。
# main に push するたびにビルドして公開する。
# 潮汐JSON・Instagramのフィードはリポジトリに含めてあるので、CIでは取得し直さない
# （Instagramの更新は月1回ローカルで `node scripts/build-instagram.mjs` → push）。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # リポジトリ名に合わせる。独自ドメインにしたら "/" に変更する
          SITE_BASE: /fishing-yamaguchi/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
