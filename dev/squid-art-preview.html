<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>イカの絵：第2版・全種（開発用）</title>
<style>
  body { margin: 0; background: #0f4c5c; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; color: #f4ead8; }
  .row { display: grid; grid-template-columns: 130px repeat(4, 1fr); align-items: center; border-bottom: 1px solid rgba(255,255,255,.15); }
  .row h2 { font-size: 17px; margin: 0; padding: 0 12px; line-height: 1.5; }
  .row h2 small { display: block; font-size: 12px; opacity: .7; }
  .cell { display: grid; place-items: center; height: 230px; }
  .cell.sea { background: linear-gradient(#1c6b82, #10485a); }
  .cell.sky { background: linear-gradient(#bfe3ef, #8fc6d8); }
  .head { display: grid; grid-template-columns: 130px repeat(4, 1fr); text-align: center; font-size: 14px; padding: 8px 0; background: #0b2a33; position: sticky; top: 0; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div class="head"><div></div><div>影（寄ってくる）胴長 44</div><div>泳ぐ（正体が分かった）胴長 56</div><div>抱いた（水中）胴長 56</div><div>取り込み（空中）胴長 90</div></div>
<div id="out"></div>
<script type="module">
  import * as A1 from '/src/js/ikabu/squid-art.js';
  import * as A2 from '/src/js/ikabu/squid-art2.js';
  const SHADOW = { ...A1.ART, ivory: '#8fb6bf', navy: '#0e2733' };
  const LIST = [['aori', 'アオリイカ'], ['kensaki', 'ケンサキイカ'], ['yari', 'ヤリイカ'], ['surume', 'スルメイカ'], ['sodeika', 'ソデイカ（ボス）'], ['kouika', 'コウイカ'], ['mongo', 'モンゴウイカ'], ['shiriyake', 'シリヤケイカ'], ['akaika', 'アカイカ（ボス）'], ['daiou', 'ダイオウイカ（伝説）'], ['hiika', 'ヒイカ']];
  const svg = (node, w, h, tx, ty, rot) => {
    const s = A1.svgEl('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}` });
    const g = A1.svgEl('g', { transform: `translate(${tx} ${ty}) rotate(${rot})` });
    g.append(node); s.append(g); return s;
  };
  const cell = (cls, node) => { const d = document.createElement('div'); d.className = 'cell ' + cls; d.append(node); return d; };
  const q = new URLSearchParams(location.search);
  const only = q.get('species');
  for (const [species, label] of LIST) {
    if (only && only !== species) continue;
    const row = document.createElement('div');
    row.className = 'row';
    const h = document.createElement('h2'); h.innerHTML = `${label}<small>${species}</small>`; row.append(h);
    const colors = A1.speciesColors(species);
    row.append(
      cell('sea', svg(A2.swimmingSquid({ species: 'default', len: 44, colors: SHADOW }), 240, 230, 120, 135, -60)),
      cell('sea', svg(A2.swimmingSquid({ species, len: 56, colors }), 240, 230, 120, 135, -60)),
      cell('sea', svg(A2.huggingSquid({ species, len: 56, colors }), 240, 230, 120, 55, 0)),
      cell('sky', svg(A2.huggingSquid({ species, len: 90, colors }), 240, 230, 120, 15, 0)),
    );
    document.getElementById('out').append(row);
  }
</script>
</body>
</html>
