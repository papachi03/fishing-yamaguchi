<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>イカの絵：今の描き方と第2版の比較（開発用）</title>
<style>
  body { margin: 0; background: #0f4c5c; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; color: #f4ead8; }
  .row { display: grid; grid-template-columns: 120px repeat(4, 1fr); align-items: center; border-bottom: 1px solid rgba(255,255,255,.15); }
  .row h2 { font-size: 18px; margin: 0; padding: 0 16px; }
  .cell { display: grid; place-items: center; height: 260px; }
  .cell.sea { background: linear-gradient(#1c6b82, #10485a); }
  .cell.sky { background: linear-gradient(#bfe3ef, #8fc6d8); }
  .head { display: grid; grid-template-columns: 120px repeat(4, 1fr); text-align: center; font-size: 15px; padding: 10px 0; background: #0b2a33; }
  svg { overflow: visible; }
</style>
</head>
<body>
<div class="head"><div></div><div>影（寄ってくる）<br>胴長 44</div><div>正体が分かった（泳ぐ）<br>胴長 56</div><div>抱いた（水中）<br>胴長 56</div><div>取り込み（空中）<br>胴長 90</div></div>
<div id="out"></div>
<script type="module">
  import * as A1 from '/src/js/ikabu/squid-art.js';
  import * as A2 from '/src/js/ikabu/squid-art2.js';
  const SHADOW = { ...A1.ART, ivory: '#8fb6bf', navy: '#0e2733' };
  const species = 'aori';
  const svg = (node, w, h, tx, ty, rot) => {
    const s = A1.svgEl('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}` });
    const g = A1.svgEl('g', { transform: `translate(${tx} ${ty}) rotate(${rot})` });
    g.append(node);
    s.append(g);
    return s;
  };
  const cell = (cls, node) => { const d = document.createElement('div'); d.className = 'cell ' + cls; d.append(node); return d; };
  for (const [label, A] of [['今の描き方', A1], ['第2版', A2]]) {
    const row = document.createElement('div');
    row.className = 'row';
    const h = document.createElement('h2'); h.textContent = label; row.append(h);
    row.append(
      cell('sea', svg(A.swimmingSquid({ species: 'default', len: 44, colors: SHADOW }), 260, 260, 130, 150, -60)),
      cell('sea', svg(A.swimmingSquid({ species, len: 56, colors: A1.speciesColors(species) }), 260, 260, 130, 150, -60)),
      cell('sea', svg(A.huggingSquid({ species, len: 56, colors: A1.speciesColors(species) }), 260, 260, 130, 70, 0)),
      cell('sky', svg(A.huggingSquid({ species, len: 90, colors: A1.speciesColors(species) }), 260, 260, 130, 30, 0)),
    );
    // 第2版の影は aori の形で（影でも種類の形にする）
    if (A === A2) row.children[1].replaceWith(cell('sea', svg(A.swimmingSquid({ species, len: 44, colors: SHADOW }), 260, 260, 130, 150, -60)));
    document.getElementById('out').append(row);
  }
</script>
</body>
</html>
